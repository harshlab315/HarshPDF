<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPG to PDF - KaagazPro</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6640527517870664" crossorigin="anonymous"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#f6f7fb;margin:0;padding:12px}.card{max-width:900px;margin:auto;background:#fff;border-radius:16px;padding:16px}.drop{border:2px dashed #6366f1;background:#f5f3ff;border-radius:12px;padding:30px;text-align:center}button{padding:10px 14px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:700;margin:3px}button.green{background:#16a34a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}.item{border:1px solid #eee;padding:6px;border-radius:8px;text-align:center;background:#fafafa}
</style>
</head>
<body>
<div class="card">
<h3>JPG to PDF - KaagazPro 🇮🇳</h3>
<div class="drop" id="drop" onclick="document.getElementById('input').click()">📁 Click karke JPG Select Karo<input type="file" id="input" accept="image/*" multiple hidden></div>
<div style="margin:10px 0">
<select id="mode" style="padding:8px;border-radius:8px;border:1px solid #ddd"><option value="single">1 Photo = 1 A4 Page (Form)</option><option value="passport">A4 pe 8 Passport Photo - Studio Print</option></select>
<button id="make" class="green">PDF Banao</button><button id="down" style="display:none;background:#111">Download PDF</button>
</div>
<div class="grid" id="list"></div><div id="msg" style="margin-top:10px;color:green;font-weight:600"></div>
</div>
<script>
let files=[],urls=[];
document.getElementById('input').onchange=e=>{handle([...e.target.files])}
function handle(f){files=f;urls=[];let l=document.getElementById('list');l.innerHTML='';files.forEach((file,i)=>{let r=new FileReader();r.onload=ev=>{urls[i]=ev.target.result;l.innerHTML+=`<div class="item"><img src="${ev.target.result}" style="width:100%;height:80px;object-fit:contain"><div style="font-size:10px">${i+1}. ${file.name.slice(0,12)}</div></div>`};r.readAsDataURL(file)})}
document.getElementById('make').onclick=()=>{
 if(!files.length)return alert('Pehle photo select karo');
 let {jsPDF}=window.jspdf;let pdf=new jsPDF('p','mm','a4');let mode=document.getElementById('mode').value;
 if(mode==='single'){
  urls.forEach((data,idx)=>{if(idx>0)pdf.addPage();pdf.addImage(data,'JPEG',10,10,190,277,undefined,'FAST')});
 } else {
  let x=10,y=10,c=0;if(urls.length)pdf.addImage(urls[0],'JPEG',10,10,35,45); // first page
  for(let k=1;k<8;k++){x+=45;if(x>170){x=10;y+=55}pdf.addImage(urls[0],'JPEG',x,y,35,45)}
  // agar multiple photos to alag pages
  for(let i=1;i<urls.length;i++){pdf.addPage();x=10;y=10;for(let k=0;k<8;k++){pdf.addImage(urls[i],'JPEG',x,y,35,45);x+=45;if(x>170){x=10;y+=55}}}
 }
 let blob=pdf.output('blob');let url=URL.createObjectURL(blob);
 document.getElementById('msg').innerText='PDF Ready: '+(blob.size/1024).toFixed(0)+'KB';
 let d=document.getElementById('down');d.style.display='inline-block';d.onclick=()=>{let a=document.createElement('a');a.href=url;a.download='KaagazPro-'+Date.now()+'.pdf';a.click()};
}
</script>
</body>
</html>
