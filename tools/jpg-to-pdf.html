<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JPG to PDF - KaagazPro</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
    <nav>
        <div class="logo">Kaagaz<span>Pro</span></div>
        <div class="menu"><a href="../index.html">Home</a><a href="../privacy.html">Privacy</a></div>
    </nav>
    <div class="page">
        <h2>JPG to PDF</h2><input type="file" id="pf" accept="image/*" multiple>
        <p id="pm" style="font-size:12px;color:#64748b;margin-top:8px">Multiple photos select karo</p><button
            class="btn" id="bp">Convert & Download PDF</button>
    </div>
    <script>document.getElementById('bp').onclick = async () => { let files = document.getElementById('pf').files; if (!files.length) return alert('JPG select karo'); const { jsPDF } = window.jspdf; let doc = new jsPDF(); for (let i = 0; i < files.length; i++) { let b64 = await new Promise(r => { let fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(files[i]); }); if (i > 0) doc.addPage(); let pr = doc.getImageProperties(b64); let w = doc.internal.pageSize.getWidth(), h = (pr.height * w) / pr.width; doc.addImage(b64, 'JPEG', 0, 0, w, h); } doc.save('kaagazpro.pdf'); document.getElementById('pm').innerText = 'PDF Download ho gaya!' };</script>
</body>

</html>
