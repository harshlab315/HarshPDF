<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aadhaar Print - KaagazPro</title>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{background:#f8f9fb;margin:0;padding:12px}
.wrap{max-width:900px;margin:auto;background:#fff;border-radius:12px;padding:16px;border:1px solid #e5e7eb}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.box{border:1px dashed #d1d5db;border-radius:10px;padding:12px;text-align:center;background:#fcfcfd}
.btn{padding:8px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;font-weight:600;cursor:pointer;font-size:13px}
.btn-primary{background:#111;color:#fff;border-color:#111}
canvas{width:100%;border:1px solid #e5e7eb;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><a href="/" style="text-decoration:none;color:#111;font-weight:700">KaagazPro</a><div style="font-size:12px;color:#6b7280">Aadhaar Print</div></div>

<div class="grid">
<div class="box">
<div style="font-weight:600;font-size:14px">Front</div>
<div id="pf" style="margin:10px 0;color:#9ca3af;font-size:12px">No image</div>
<button class="btn" onclick="f_gal.click()">Gallery</button>
<button class="btn" onclick="f_cam.click()">Camera</button>
<input id="f_gal" type="file" accept="image/*" hidden>
<input id="f_cam" type="file" accept="image/*" capture="environment" hidden>
</div>
<div class="box">
<div style="font-weight:600;font-size:14px">Back <span style="color:#9ca3af;font-weight:400">(optional)</span></div>
<div id="pb" style="margin:10px 0;color:#9ca3af;font-size:12px">No image</div>
<button class="btn" onclick="b_gal.click()">Gallery</button>
<button class="btn" onclick="b_cam.click()">Camera</button>
<input id="b_gal" type="file" accept="image/*" hidden>
<input id="b_cam" type="file" accept="image/*" capture="environment" hidden>
</div>
</div>

<div style="margin-top:12px;display:flex;gap:8px">
<select id="layout" style="flex:1;padding:8px;border-radius:6px;border:1px solid #e5e7eb"><option value="both">Front + Back</option><option value="front2">Front x2</option><option value="single">Single</option></select>
<button id="make" class="btn btn-primary">Generate A4</button>
</div>

<div style="margin-top:8px;display:flex;gap:6px">
<button id="dlJ" class="btn" style="display:none">Download JPG</button>
<button id="dlP" class="btn" style="display:none">Download PDF</button>
<button id="prt" class="btn" style="display:none">Print</button>
</div>

<div style="margin-top:12px;text-align:center"><canvas id="a4" width="2480" height="3508"></canvas></div>
</div>

<script>
let F=null,B=null;
function handle(f,t){if(!f)return;let r=new FileReader();r.onload=e=>{let i=new Image();i.onload=()=>{if(t=='f'){F=i;pf.innerHTML=`<img src="${e.target.result}" style="width:100%;height:120px;object-fit:contain">`}else{B=i;pb.innerHTML=`<img src="${e.target.result}" style="width:100%;height:120px;object-fit:contain">`}};i.src=e.target.result};r.readAsDataURL(f);}
f_gal.onchange=e=>handle(e.target.files[0],'f');f_cam.onchange=e=>handle(e.target.files[0],'f');b_gal.onchange=e=>handle(e.target.files[0],'b');b_cam.onchange=e=>handle(e.target.files[0],'b');
make.onclick=()=>{if(!F&&!B)return alert('Select image');let c=a4,ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);let W=1011,H=638,f=F||B,b=B||F;let draw=(img,x,y)=>{ctx.drawImage(img,x,y,W,H);ctx.setLineDash([12,8]);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(x,y,W,H);ctx.setLineDash([])};if(layout.value=='both'){draw(f,740,800);draw(b,740,800+H+120)}else if(layout.value=='front2'){draw(f,740,800);draw(f,740,800+H+120)}else{draw(f,620,1100)};dlJ.style.display='inline-block';dlP.style.display='inline-block';prt.style.display='inline-block'};
dlJ.onclick=()=>{let a=document.createElement('a');a.href=a4.toDataURL('image/jpeg',0.9);a.download='aadhaar.jpg';a.click()};
dlP.onclick=()=>{let {jsPDF}=window.jspdf;let p=new jsPDF('p','mm','a4');p.addImage(a4.toDataURL('image/jpeg',0.85),'JPEG',0,0,210,297);p.save('aadhaar.pdf')};
prt.onclick=()=>{let w=window.open('');w.document.write(`<img src="${a4.toDataURL()}" style="width:100%">`);w.print()};
</script>
</body>
</html>
