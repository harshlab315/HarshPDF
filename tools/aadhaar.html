<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aadhaar Card - KaagazPro</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#f6f7fb;padding:12px}
.wrap{max-width:600px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}
.card{border:1.5px dashed #d1d5db;border-radius:12px;padding:12px;text-align:center;background:#fafafa;position:relative}
.prev{height:220px;background:#fff;border:1px solid #eee;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:10px 0;overflow:hidden}
.prev img{max-width:100%;max-height:100%}
.btn{padding:8px 14px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.btn-dark{background:#111;color:#fff;border-color:#111}
#cropM{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:99;padding:10px}
#cropB{background:#fff;border-radius:12px;max-width:600px;margin:auto;padding:12px}
</style>
</head>
<body>
<div style="max-width:600px;margin:0 auto 10px;display:flex;justify-content:space-between"><a href="/" style="text-decoration:none;font-weight:800;color:#111">← KaagazPro</a><button onclick="location.reload()" class="btn">↻ Refresh</button></div>

<div class="wrap">
<h3 style="margin:0 0 10px">Aadhaar Card Tool</h3>

<div class="card">
<div class="prev" id="prev">No Image Selected</div>
<div style="display:flex;gap:6px;justify-content:center">
<button class="btn" onclick="gal.click()">📁 Gallery</button>
<button class="btn" onclick="cam.click()">📷 Camera</button>
</div>
<div style="display:flex;gap:6px;justify-content:center;margin-top:8px">
<button class="btn" onclick="rotateImg()">↺ Rotate</button>
<button class="btn" onclick="openCrop()">✂️ Crop</button>
<button class="btn" style="color:#ef4444" onclick="clearImg()">🗑️ Remove</button>
</div>
<input id="gal" type="file" accept="image/*" hidden>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
</div>

<div style="display:flex;gap:8px;margin-top:14px">
<button id="dlJ" class="btn-dark" style="display:none;flex:1">Download JPG</button>
<button id="dlP" class="btn" style="display:none;flex:1">Download PDF</button>
</div>
</div>

<div id="cropM"><div id="cropB"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>Crop Aadhaar</b><button class="btn" onclick="closeCrop()">✕</button></div><img id="cropImg" style="max-width:100%"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="cropR(-90)">↺</button><button class="btn" onclick="cropR(90)">↻</button><button class="btn-dark" onclick="saveCrop()" style="flex:1">Save Crop</button></div></div></div>

<script>
let curImg=null,raw=null,cropper=null;
function load(f){if(!f)return;let r=new FileReader();r.onload=e=>{raw=e.target.result;let im=new Image();im.onload=()=>{curImg=im;prev.innerHTML=`<img src="${raw}">`;dlJ.style.display='block';dlP.style.display='block'};im.src=raw;};r.readAsDataURL(f);}
gal.onchange=e=>load(e.target.files[0]);cam.onchange=e=>load(e.target.files[0]);
function clearImg(){curImg=null;raw=null;prev.innerHTML='No Image Selected';gal.value='';cam.value='';dlJ.style.display='none';dlP.style.display='none'}
function rotateImg(){if(!curImg)return;let cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=curImg.height;cv.height=curImg.width;x.translate(cv.width/2,cv.height/2);x.rotate(-90*Math.PI/180);x.drawImage(curImg,-curImg.width/2,-curImg.height/2);raw=cv.toDataURL();let im=new Image();im.onload=()=>{curImg=im;prev.innerHTML=`<img src="${raw}">`};im.src=raw}
function openCrop(){if(!raw)return;cropImg.src=raw;cropM.style.display='block';setTimeout(()=>{if(cropper)cropper.destroy();cropper=new Cropper(cropImg,{viewMode:1,autoCropArea:0.9})},100)}
function closeCrop(){cropM.style.display='none';if(cropper){cropper.destroy();cropper=null}}
function cropR(d){if(cropper)cropper.rotate(d)}
function saveCrop(){if(!cropper)return;let c=cropper.getCroppedCanvas({imageSmoothingQuality:'high'});raw=c.toDataURL();let im=new Image();im.onload=()=>{curImg=im;prev.innerHTML=`<img src="${raw}">`;closeCrop()};im.src=raw}
dlJ.onclick=()=>{if(!raw)return;let a=document.createElement('a');a.href=raw;a.download='aadhaar.jpg';a.click()};
dlP.onclick=()=>{if(!raw)return;let p=new jspdf.jsPDF();let w=p.internal.pageSize.getWidth();let img=new Image();img.onload=()=>{let h=(img.height/img.width)*w;p.addImage(raw,'JPEG',0,0,w,h);p.save('aadhaar.pdf')};img.src=raw};
</script>
</body>
</html>
