<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aadhaar Card Print - KaagazPro</title>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#f5f7fb;padding:12px}
.top{max-width:920px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:920px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{border:1.5px dashed #d4d4d8;border-radius:12px;padding:14px;text-align:center;background:#fafafa;transition:.2s}
.card:hover{border-color:#111;background:#fff}
.preview{height:130px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eee;border-radius:8px;margin:10px 0;overflow:hidden}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.btn{padding:8px 14px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:#111;color:#fff;border-color:#111}
.btn-dark{background:#111;color:#fff;border-color:#111;padding:10px 18px;border-radius:10px;font-weight:700}
select{width:100%;padding:10px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-weight:600}
canvas{width:100%;border:1px solid #e5e7eb;border-radius:10px}
</style>
</head>
<body>
<div class="top"><a href="/" style="text-decoration:none;color:#111;font-weight:800">← KaagazPro</a><span style="font-size:12px;background:#111;color:#fff;padding:5px 10px;border-radius:20px">Aadhaar Tool</span></div>

<div class="wrap">
<div class="grid">
<div class="card">
<div style="font-weight:700">Front Side</div>
<div class="preview" id="pf">No image</div>
<div style="display:flex;gap:6px;justify-content:center">
<button class="btn" onclick="f_gal.click()">Gallery</button>
<button class="btn" onclick="f_cam.click()">Camera</button>
</div>
<input id="f_gal" type="file" accept="image/*" hidden>
<input id="f_cam" type="file" accept="image/*" capture="environment" hidden>
</div>

<div class="card">
<div style="font-weight:700">Back Side <span style="font-weight:400;color:#888">(optional)</span></div>
<div class="preview" id="pb">No image</div>
<div style="display:flex;gap:6px;justify-content:center">
<button class="btn" onclick="b_gal.click()">Gallery</button>
<button class="btn" onclick="b_cam.click()">Camera</button>
</div>
<input id="b_gal" type="file" accept="image/*" hidden>
<input id="b_cam" type="file" accept="image/*" capture="environment" hidden>
</div>
</div>

<div style="display:flex;gap:8px;margin-top:14px">
<select id="layout"><option value="both">Front + Back on A4</option><option value="front2">Front x2 Copies</option><option value="single">Single Large</option></select>
<button id="make" class="btn-dark">Generate A4</button>
</div>

<div style="display:flex;gap:6px;margin-top:10px">
<button id="dlJ" class="btn" style="display:none">JPG</button>
<button id="dlP" class="btn" style="display:none">PDF</button>
<button id="prt" class="btn" style="display:none">Print</button>
</div>

<div style="margin-top:14px;text-align:center;background:#f9fafb;padding:10px;border-radius:12px"><canvas id="a4" width="2480" height="3508"></canvas></div>
</div>

<script>
let F=null,B=null;
function load(file,type){if(!file)return;let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{if(type=='f'){F=img;pf.innerHTML=`<img src="${e.target.result}">`}else{B=img;pb.innerHTML=`<img src="${e.target.result}">`}};img.src=e.target.result};r.readAsDataURL(file);}
f_gal.onchange=e=>load(e.target.files[0],'f');f_cam.onchange=e=>load(e.target.files[0],'f');b_gal.onchange=e=>load(e.target.files[0],'b');b_cam.onchange=e=>load(e.target.files[0],'b');

make.onclick=()=>{
if(!F&&!B)return alert('Select at least one image');
let cv=a4,ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
let W=1011,H=638,f=F||B,b=B||F;
let draw=(im,x,y)=>{ctx.drawImage(im,x,y,W,H);ctx.setLineDash([14,8]);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(x,y,W,H);ctx.setLineDash([])};
if(layout.value=='both'){draw(f,740,750);draw(b,740,750+H+120)}
else if(layout.value=='front2'){draw(f,740,750);draw(f,740,750+H+120)}
else{draw(f,620,1000,W*1.2,H*1.2)}
dlJ.style.display='block';dlP.style.display='block';prt.style.display='block';
cv.scrollIntoView({behavior:'smooth'});
};
dlJ.onclick=()=>{let a=document.createElement('a');a.href=a4.toDataURL('image/jpeg',0.92);a.download='aadhaar-a4.jpg';a.click()};
dlP.onclick=()=>{let {jsPDF}=window.jspdf;let p=new jsPDF('p','mm','a4');p.addImage(a4.toDataURL('image/jpeg',0.85),'JPEG',0,0,210,297);p.save('aadhaar-a4.pdf')};
prt.onclick=()=>{let w=window.open('');w.document.write(`<img src="${a4.toDataURL()}" style="width:100%">`);w.document.close();w.print()};
</script>
</body>
</html>
