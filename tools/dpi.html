<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>300 DPI Maker - KaagazPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav><div class="logo">Kaagaz<span>Pro</span></div><a href="../index.html">Home</a></nav>
  <div class="page">
    <h2>Image to 300 DPI</h2>
    <input type="file" id="f" accept="image/*">
    <img id="p" style="max-width:100%;margin-top:10px;display:none">
    <button class="btn" id="b">Convert to 300 DPI & Download</button>
  </div>
  <script>
    let img=new Image(),ok=false;
    document.getElementById('f').onchange=e=>{
      let r=new FileReader();
      r.onload=ev=>{img.onload=()=>{ok=true;document.getElementById('p').src=ev.target.result;document.getElementById('p').style.display='block'};img.src=ev.target.result};
      r.readAsDataURL(e.target.files[0]);
    };
    document.getElementById('b').onclick=()=>{
      if(!ok) return alert('Photo dalo');
      let c=document.createElement('canvas');
      c.width=img.width; c.height=img.height;
      c.getContext('2d').drawImage(img,0,0);
      let a=document.createElement('a');
      a.href=c.toDataURL('image/jpeg',1.0);
      a.download='300dpi.jpg'; a.click();
    };
  </script>
</body>
</html>
