<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merge PDF - KaagazPro</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav><div class="logo">Kaagaz<span>Pro</span></div><a href="../index.html">Home</a></nav>
  <div class="page">
    <h2>Merge Images to One PDF</h2>
    <input type="file" id="f" accept="image/*" multiple>
    <p id="i" style="font-size:12px;color:#64748b;margin-top:6px">10 images tak select karo</p>
    <button class="btn" id="b">Merge & Download PDF</button>
  </div>
  <script>
    document.getElementById('b').onclick=async()=>{
      let files=document.getElementById('f').files;
      if(!files.length) return alert('Images select karo');
      const {jsPDF}=window.jspdf; let doc=new jsPDF();
      for(let j=0;j<files.length;j++){
        let b64=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(files[j]);});
        if(j>0) doc.addPage();
        let pr=doc.getImageProperties(b64);
        let w=doc.internal.pageSize.getWidth(), h=(pr.height*w)/pr.width;
        doc.addImage(b64,'JPEG',0,0,w,h);
      }
      doc.save('merged-kaagazpro.pdf');
      document.getElementById('i').innerText='Merged PDF Download ho gaya!';
    };
  </script>
</body>
</html>
